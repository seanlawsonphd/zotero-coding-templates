# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Item] Memo Report BODY (do not use)"
content: |-
  // @use-refresh
  // @beforeloop-begin
  // @use-markdown
  ${{
    var ask = function (title, msg, def) {
      try {
        var box = { value: def || "" };
        var ok = Services.prompt.prompt(null, title, msg, box, null, {});
        return ok ? box.value : "";
      } catch (e) {
        try {
          return Zotero.getMainWindow().prompt(msg, def || "") || "";
        } catch (e2) {
          return "";
        }
      }
    };

    var clean = function (s) {
      return (s || "").replace(/\s+/g, " ").trim();
    };

    var scope = function (item) {
      var lib = Zotero.Libraries.get(item.libraryID);
      return lib && lib.isGroup ? "groups/" + lib.id : "library";
    };

    // Full reference for a source, in APA style. Change the style id below to use
    // another installed citation style.
    var citeFormat = "bibliography=http://www.zotero.org/styles/apa";
    var citeCache = {};
    var mdEscape = function (s) {
      return (s || "").replace(/([\\\x60*_\[\]<>])/g, "\\$1");
    };
    var fullCite = function (item, fallback) {
      var target = item;
      try {
        if (item.isAttachment() && item.parentItemID) {
          target = Zotero.Items.get(item.parentItemID) || item;
        }
      } catch (e) {
        target = item;
      }
      if (citeCache[target.id]) return citeCache[target.id];
      var text = "";
      try {
        if (target.isRegularItem()) {
          var res = Zotero.QuickCopy.getContentFromItems([target], citeFormat);
          text = ((res && res.text) || "").replace(/\s+/g, " ").trim();
        }
      } catch (e) {
        text = "";
      }
      if (!text) text = fallback;
      citeCache[target.id] = text;
      return text;
    };

    var describe = function (item) {
      var creators = item.getCreators();
      var author = "No author";
      if (creators.length === 1) {
        author = creators[0].lastName || creators[0].firstName || "No author";
      } else if (creators.length > 1) {
        author = (creators[0].lastName || creators[0].firstName) + " et al.";
      }
      var date = item.getField("date") || "";
      var m = date.match(/\d{4}/);
      var year = m ? m[0] : "n.d.";
      var outlet =
        item.getField("publicationTitle") ||
        item.getField("websiteTitle") ||
        item.getField("publisher") ||
        item.getField("blogTitle") ||
        "";
      return {
        label: author + " (" + year + ")",
        title: item.getField("title") || "Untitled",
        outlet: outlet,
        link: "zotero://select/" + scope(item) + "/items/" + item.key,
        cite: fullCite(
          item,
          author + " (" + year + "). " + (item.getField("title") || "Untitled") +
            (outlet ? ". " + outlet : "") + "."
        )
      };
    };

    var harvest = async function (item) {
      var source = describe(item);
      var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();
      var out = [];
      var skipped = [];
      var untagged = [];
      for (var i = 0; i < attIDs.length; i++) {
        var att = Zotero.Items.get(attIDs[i]);
        if (!att) {
          try {
            att = await Zotero.Items.getAsync(attIDs[i]);
          } catch (e) {
            continue;
          }
        }
        if (!att) continue;
        var anns = [];
        try {
          anns = att.getAnnotations() || [];
        } catch (e) {
          anns = [];
        }
        for (var j = 0; j < anns.length; j++) {
          var ann = anns[j];
          var text = clean(ann.annotationText);
          var memo = clean(ann.annotationComment);
          var codes = ann
            .getTags()
            .map(function (t) { return t.tag; })
            .filter(function (t) { return t && t.indexOf("zotero://") !== 0; });
          var link =
            "zotero://open/" + scope(item) + "/items/" +
            att.key + "?annotation=" + ann.key;
          var who = "";
          try {
            who = ann.annotationAuthorName || "";
            if (!who && ann.createdByUserID) who = Zotero.Users.getName(ann.createdByUserID) || "";
          } catch (e) {
            who = "";
          }
          if (!codes.length) {
            if (text || memo) {
              untagged.push({
                text: text, memo: memo, codes: [], source: source,
                page: ann.annotationPageLabel || "", link: link, author: who, att: att.key
              });
            }
            continue;
          }
          // Coded, but nothing to quote. Usually an image or area annotation.
          // Record it so the report can say so instead of dropping it silently.
          if (!text && !memo) {
            skipped.push({ codes: codes, source: source });
            continue;
          }
          out.push({
            text: text,
            memo: memo,
            codes: codes,
            source: source,
            page: ann.annotationPageLabel || "",
            link: link,
            author: who,
            att: att.key
          });
        }
      }
      return { source: source, extracts: out, skipped: skipped, untagged: untagged };
    };

    var renderExtract = function (e, showCodes) {
      var lines = [];
      lines.push(e.text ? "> " + e.text : "> *(no highlighted text, memo only)*");
      lines.push("> ");
      var cite = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) cite += " (p. " + e.page + ")";
      cite += " [\\[Open highlight\\]](" + e.link + ")";
      lines.push(cite);
      if (e.memo) {
        lines.push("> ");
        lines.push("> **Memo:** " + e.memo);
      }
      if (showCodes && e.codes.length > 1) {
        lines.push("> ");
        lines.push("> *Also coded:* " + e.codes.join(", "));
      }
      return lines.join("\n");
    };

    var findCollection = function (libraryID, name) {
      var all = [];
      try {
        all = Zotero.Collections.getByLibrary(libraryID, true) || [];
      } catch (e) {
        all = [];
      }
      var want = name.toLowerCase();
      for (var i = 0; i < all.length; i++) {
        if ((all[i].name || "").toLowerCase() === want) return all[i];
      }
      for (var k = 0; k < all.length; k++) {
        if ((all[k].name || "").toLowerCase().indexOf(want) !== -1) return all[k];
      }
      return null;
    };

    // The sources are the items this template was run on (kept in the block
    // header, so a refresh scans the same items). Selected notes are set aside.
    var noteItems = items.filter(function (it) { return it.isNote && it.isNote(); });
    var scanItems = items.filter(function (it) { return !(it.isNote && it.isNote()); });


    // ---------- harvest ----------
    var byCode = {};
    var uncoded = [];
    var skippedAll = [];
    var codedSources = 0;
    var sourceList = [];
    var allEx = [];
    var untaggedAll = [];
    for (var n = 0; n < scanItems.length; n++) {
      var res = await harvest(scanItems[n]);
      sourceList.push(res.source);
      res.untagged.forEach(function (u) { untaggedAll.push(u); });
      res.extracts.forEach(function (e0) { allEx.push(e0); });
      for (var s = 0; s < res.skipped.length; s++) skippedAll.push(res.skipped[s]);
      if (!res.extracts.length) {
        uncoded.push(res.source);
        continue;
      }
      codedSources += 1;
      for (var x = 0; x < res.extracts.length; x++) {
        var ex = res.extracts[x];
        for (var y = 0; y < ex.codes.length; y++) {
          var c = ex.codes[y];
          if (!byCode[c]) byCode[c] = [];
          byCode[c].push(ex);
        }
      }
    }

    // ---------- render ----------
    var ci = function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); };
    var codes = Object.keys(byCode).sort(ci);
    var countSources = function (list) {
      var s = new Set(list.map(function (e) { return e.source.link; }));
      return s.size;
    };
    var cell = function (text) { return String(text).replace(/\|/g, "\\|"); };
    var shorten = function (text, max) {
      text = String(text || "");
      return text.length > max ? text.slice(0, max - 1).trim() + "\u2026" : text;
    };
    var cite = function (e) {
      var line = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) line += " (p. " + e.page + ")";
      return line + " [\\[Open highlight\\]](" + e.link + ")";
    };
    var scannedLabel = scanItems.length + " selected item(s)";
    var out = [];
    var memos = allEx.concat(untaggedAll).filter(function (e) { return e.memo; });
    var srcIndex = {};
    sourceList.forEach(function (s, i) { srcIndex[s.link] = i; });
    memos.sort(function (a, b) { return srcIndex[a.source.link] - srcIndex[b.source.link]; });
    var uncodedMemos = memos.filter(function (e) { return !e.codes.length; }).length;
    out.push("<span style=\"color: #e03131\"><em><strong>Everything from here down to the line below Analytical Notes is regenerated every time you refresh this note.</strong> Do not type inside it. Write your own notes below that line, or a refresh will erase them.</em></span>");
    out.push("");
    out.push("## Scope");
    out.push("");
    out.push("- **" + "Built from " + memos.length + " memo(s) in " + countSources(memos) + " source(s), out of " + scanItems.length + " sources scanned." + "**");
    out.push("- **Memos on highlights with no code yet:** " + uncodedMemos);
    out.push("- **Scanned:** " + scannedLabel);
    var shown = sourceList.slice(0, 50);
    for (var s2 = 0; s2 < shown.length; s2++) {
      out.push("  - " + mdEscape(shown[s2].cite));
    }
    if (sourceList.length > shown.length) {
      out.push("  - and " + (sourceList.length - shown.length) + " more");
    }
    out.push("- **Generated:** " + new Date().toLocaleString());
    out.push("");
    out.push("## Memos");
    if (!memos.length) {
      out.push("");
      out.push("> No memos were found. A memo is a comment written on a highlight in the Zotero reader.");
    }
    memos.forEach(function (e) {
      out.push("");
      out.push("> **Memo:** " + e.memo);
      out.push("> ");
      out.push("> *Passage:* " + (e.text ? e.text : "*(no highlighted text)*"));
      out.push("> ");
      out.push(cite(e));
      out.push("> ");
      out.push("> **Codes:** " + (e.codes.length ? e.codes.join(", ") : "*none yet*"));
    });
    out.push("");
    out.push("## Analytical Notes");
    out.push("");
    out.push("*Write your thoughts about these memos after the line below. For example, note ideas that come up more than once, memos that suggest a new code, and questions to follow up.*");
    return out.join("\n");
  }}$
  // @beforeloop-end
  // @default-begin
  // @default-end
