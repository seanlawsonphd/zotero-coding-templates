# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[text] Helper for Code by Source (do not use)"
content: |-
  // @use-refresh
  // @use-markdown
  ${{
    var ask = function (title, msg, def) {
      try {
        var box = { value: def || "" };
        var ok = Services.prompt.prompt(null, title, msg, box, null, {});
        return ok ? box.value : "";
      } catch (e) {
        try {
          return Zotero.getMainWindow().prompt(msg, def || "") || "";
        } catch (e2) {
          return "";
        }
      }
    };

    var clean = function (s) {
      return (s || "").replace(/\s+/g, " ").trim();
    };

    var scope = function (item) {
      var lib = Zotero.Libraries.get(item.libraryID);
      return lib && lib.isGroup ? "groups/" + lib.id : "library";
    };

    // Full reference for a source, in APA style. Change the style id below to use
    // another installed citation style.
    var citeFormat = "bibliography=http://www.zotero.org/styles/apa";
    var citeCache = {};
    var mdEscape = function (s) {
      return (s || "").replace(/([\\\x60*_\[\]<>])/g, "\\$1");
    };
    var fullCite = function (item, fallback) {
      var target = item;
      try {
        if (item.isAttachment() && item.parentItemID) {
          target = Zotero.Items.get(item.parentItemID) || item;
        }
      } catch (e) {
        target = item;
      }
      if (citeCache[target.id]) return citeCache[target.id];
      var text = "";
      try {
        if (target.isRegularItem()) {
          var res = Zotero.QuickCopy.getContentFromItems([target], citeFormat);
          text = ((res && res.text) || "").replace(/\s+/g, " ").trim();
        }
      } catch (e) {
        text = "";
      }
      if (!text) text = fallback;
      citeCache[target.id] = text;
      return text;
    };

    var describe = function (item) {
      var creators = item.getCreators();
      var author = "No author";
      if (creators.length === 1) {
        author = creators[0].lastName || creators[0].firstName || "No author";
      } else if (creators.length > 1) {
        author = (creators[0].lastName || creators[0].firstName) + " et al.";
      }
      var date = item.getField("date") || "";
      var m = date.match(/\d{4}/);
      var year = m ? m[0] : "n.d.";
      var outlet =
        item.getField("publicationTitle") ||
        item.getField("websiteTitle") ||
        item.getField("publisher") ||
        item.getField("blogTitle") ||
        "";
      return {
        label: author + " (" + year + ")",
        title: item.getField("title") || "Untitled",
        outlet: outlet,
        link: "zotero://select/" + scope(item) + "/items/" + item.key,
        cite: fullCite(
          item,
          author + " (" + year + "). " + (item.getField("title") || "Untitled") +
            (outlet ? ". " + outlet : "") + "."
        )
      };
    };

    var harvest = async function (item) {
      var source = describe(item);
      var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();
      var out = [];
      var skipped = [];
      var untagged = [];
      for (var i = 0; i < attIDs.length; i++) {
        var att = Zotero.Items.get(attIDs[i]);
        if (!att) {
          try {
            att = await Zotero.Items.getAsync(attIDs[i]);
          } catch (e) {
            continue;
          }
        }
        if (!att) continue;
        var anns = [];
        try {
          anns = att.getAnnotations() || [];
        } catch (e) {
          anns = [];
        }
        for (var j = 0; j < anns.length; j++) {
          var ann = anns[j];
          var text = clean(ann.annotationText);
          var memo = clean(ann.annotationComment);
          var codes = ann
            .getTags()
            .map(function (t) { return t.tag; })
            .filter(function (t) { return t && t.indexOf("zotero://") !== 0; });
          var link =
            "zotero://open/" + scope(item) + "/items/" +
            att.key + "?annotation=" + ann.key;
          var who = "";
          try {
            who = ann.annotationAuthorName || "";
            if (!who && ann.createdByUserID) who = Zotero.Users.getName(ann.createdByUserID) || "";
          } catch (e) {
            who = "";
          }
          if (!codes.length) {
            if (text || memo) {
              untagged.push({
                text: text, memo: memo, codes: [], source: source,
                page: ann.annotationPageLabel || "", link: link, author: who, att: att.key
              });
            }
            continue;
          }
          // Coded, but nothing to quote. Usually an image or area annotation.
          // Record it so the report can say so instead of dropping it silently.
          if (!text && !memo) {
            skipped.push({ codes: codes, source: source });
            continue;
          }
          out.push({
            text: text,
            memo: memo,
            codes: codes,
            source: source,
            page: ann.annotationPageLabel || "",
            link: link,
            author: who,
            att: att.key
          });
        }
      }
      return { source: source, extracts: out, skipped: skipped, untagged: untagged };
    };

    var renderExtract = function (e, showCodes) {
      var lines = [];
      lines.push(e.text ? "> " + e.text : "> *(no highlighted text, memo only)*");
      lines.push("> ");
      var cite = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) cite += " (p. " + e.page + ")";
      cite += " [\\[Open highlight\\]](" + e.link + ")";
      lines.push(cite);
      if (e.memo) {
        lines.push("> ");
        lines.push("> **Memo:** " + e.memo);
      }
      if (showCodes && e.codes.length > 1) {
        lines.push("> ");
        lines.push("> *Also coded:* " + e.codes.join(", "));
      }
      return lines.join("\n");
    };

    var findCollection = function (libraryID, name) {
      var all = [];
      try {
        all = Zotero.Collections.getByLibrary(libraryID, true) || [];
      } catch (e) {
        all = [];
      }
      var want = name.toLowerCase();
      for (var i = 0; i < all.length; i++) {
        if ((all[i].name || "").toLowerCase() === want) return all[i];
      }
      for (var k = 0; k < all.length; k++) {
        if ((all[k].name || "").toLowerCase().indexOf(want) !== -1) return all[k];
      }
      return null;
    };

    // ---------- resolve the scope ----------
    var pane = null;
    try {
      pane = Zotero.getActiveZoteroPane();
    } catch (e) {
      pane = null;
    }
    if (!pane) {
      try {
        pane = Zotero.getMainWindow().ZoteroPane;
      } catch (e) {
        pane = null;
      }
    }

    var coll = null;
    if (pane && typeof pane.getSelectedCollection === "function") {
      try {
        coll = pane.getSelectedCollection() || null;
      } catch (e) {
        coll = null;
      }
    }

    var libraryID = coll ? coll.libraryID : Zotero.Libraries.userLibraryID;
    var wholeLibrary = false;

    if (!coll && !_env.dryRun) {
      var typed = clean(
        ask(
          "Code by Source",
          "No collection is highlighted in the left pane. Type a collection name to scan, or type * to scan the entire library.",
          ""
        )
      );
      if (typed === "*") {
        wholeLibrary = true;
      } else if (typed) {
        coll = findCollection(libraryID, typed);
        if (!coll) {
          return "> No collection named **" + typed +
            "** was found. Check the spelling, or click the collection in the left pane before running this template.";
        }
      } else {
        return "> Nothing to scan. Click a collection in the left pane and run this template again, or type a collection name at the prompt.";
      }
    }

    // ---------- gather top-level items ----------
    var items = [];
    var noteItems = [];
    var seenIDs = new Set();
    var keep = function (it) {
      if (!it || seenIDs.has(it.id)) return;
      if (it.isNote && it.isNote()) {
        if (!it.parentItemID && noteItems.indexOf(it) === -1) noteItems.push(it);
        return;
      }
      if (it.isAnnotation && it.isAnnotation()) return;
      if (it.isAttachment && it.isAttachment() && it.parentItemID) return;
      seenIDs.add(it.id);
      items.push(it);
    };

    var scopeName = "Entire library";
    if (wholeLibrary) {
      var all = await Zotero.Items.getAll(libraryID, true);
      for (var a = 0; a < all.length; a++) keep(all[a]);
    } else {
      scopeName = coll.name;
      var walk = function (c) {
        var kids = [];
        try { kids = c.getChildItems() || []; } catch (e) { kids = []; }
        for (var i = 0; i < kids.length; i++) keep(kids[i]);
        var subs = [];
        try { subs = c.getChildCollections() || []; } catch (e) { subs = []; }
        for (var j = 0; j < subs.length; j++) walk(subs[j]);
      };
      walk(coll);
    }

    var scanItems = items;

    // ---------- harvest ----------
    var byCode = {};
    var uncoded = [];
    var skippedAll = [];
    var codedSources = 0;
    var sourceList = [];
    var allEx = [];
    var untaggedAll = [];
    for (var n = 0; n < scanItems.length; n++) {
      var res = await harvest(scanItems[n]);
      sourceList.push(res.source);
      res.untagged.forEach(function (u) { untaggedAll.push(u); });
      res.extracts.forEach(function (e0) { allEx.push(e0); });
      for (var s = 0; s < res.skipped.length; s++) skippedAll.push(res.skipped[s]);
      if (!res.extracts.length) {
        uncoded.push(res.source);
        continue;
      }
      codedSources += 1;
      for (var x = 0; x < res.extracts.length; x++) {
        var ex = res.extracts[x];
        for (var y = 0; y < ex.codes.length; y++) {
          var c = ex.codes[y];
          if (!byCode[c]) byCode[c] = [];
          byCode[c].push(ex);
        }
      }
    }

    // ---------- render ----------
    var ci = function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); };
    var codes = Object.keys(byCode).sort(ci);
    var countSources = function (list) {
      var s = new Set(list.map(function (e) { return e.source.link; }));
      return s.size;
    };
    var cell = function (text) { return String(text).replace(/\|/g, "\\|"); };
    var shorten = function (text, max) {
      text = String(text || "");
      return text.length > max ? text.slice(0, max - 1).trim() + "\u2026" : text;
    };
    var cite = function (e) {
      var line = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) line += " (p. " + e.page + ")";
      return line + " [\\[Open highlight\\]](" + e.link + ")";
    };
    var scannedLabel = (wholeLibrary ? "the entire library" : "the collection " + mdEscape(scopeName)) + " (" + scanItems.length + " source(s))";
    var out = [];
    out.push("<span style=\"color: #e03131\"><em><strong>Everything from here down to the line below Analytical Notes is regenerated every time you refresh this note.</strong> Do not type inside it. Write your own notes below that line, or a refresh will erase them.</em></span>");
    out.push("");
    out.push("## Scope");
    out.push("");
    out.push("- **" + "Built from " + codes.length + " code(s), " + allEx.length + " extract(s), " + codedSources + " source(s), out of " + scanItems.length + " sources scanned." + "**");
    out.push("- **Scanned:** " + scannedLabel);
    out.push("- **Generated:** " + new Date().toLocaleString());
    out.push("");

    var outlets = [];
    var byOutlet = {};
    var bySrc = {};
    var srcOrder = [];
    allEx.forEach(function (e) {
      var o = e.source.outlet || "(no publication)";
      if (!byOutlet[o]) { byOutlet[o] = { total: 0, counts: {} }; outlets.push(o); }
      if (!bySrc[e.source.link]) { bySrc[e.source.link] = { source: e.source, total: 0, counts: {} }; srcOrder.push(e.source.link); }
      byOutlet[o].total += 1;
      bySrc[e.source.link].total += 1;
      e.codes.forEach(function (c) {
        byOutlet[o].counts[c] = (byOutlet[o].counts[c] || 0) + 1;
        bySrc[e.source.link].counts[c] = (bySrc[e.source.link].counts[c] || 0) + 1;
      });
    });
    outlets.sort(ci);

    out.push("## Codes by publication");
    out.push("");
    if (!codes.length) {
      out.push("> No tagged highlights were found. Highlight a passage in the Zotero reader, then add a tag to that highlight in the annotation sidebar. A highlight with no tag is not a code.");
    } else {
      out.push("*Each cell counts the extracts with that code in sources from that publication. The last row is the number of coded extracts from each publication.*");
      out.push("");
      out.push("| Code | " + outlets.map(cell).join(" | ") + " | All |");
      out.push("| :-- |" + outlets.map(function () { return " :-: |"; }).join("") + " :-: |");
      codes.forEach(function (c) {
        var row = "| **" + cell(c) + "** |";
        outlets.forEach(function (o) { row += " " + (byOutlet[o].counts[c] || 0) + " |"; });
        out.push(row + " " + byCode[c].length + " |");
      });
      var totals = "| *Coded extracts* |";
      outlets.forEach(function (o) { totals += " " + byOutlet[o].total + " |"; });
      out.push(totals + " " + allEx.length + " |");
      out.push("");
      out.push("## Codes by source");
      out.push("");
      out.push("*One row for each source that has coded extracts. Each cell counts the extracts with that code in that source.*");
      out.push("");
      out.push("| Source | " + codes.map(cell).join(" | ") + " | Coded extracts |");
      out.push("| :-- |" + codes.map(function () { return " :-: |"; }).join("") + " :-: |");
      srcOrder.forEach(function (link) {
        var s = bySrc[link];
        var name = cell(mdEscape(shorten(s.source.title, 60)));
        if (s.source.outlet) name += " (" + cell(mdEscape(s.source.outlet)) + ")";
        var row = "| [" + name + "](" + s.source.link + ") |";
        codes.forEach(function (c) { row += " " + (s.counts[c] || 0) + " |"; });
        out.push(row + " " + s.total + " |");
      });
    }
    out.push("");
    out.push("## Analytical Notes");
    out.push("");
    out.push("*Write your thoughts about these patterns after the line below. For example, note which codes are concentrated in one publication or source, which appear everywhere, and what that might tell you.*");
    return out.join("\n");
  }}$
