# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Text] Code Report BODY (do not use)"
content: |-
  // @use-refresh
  // @use-markdown
  ${{
    var ask = function (title, msg, def) {
      try {
        var box = { value: def || "" };
        var ok = Services.prompt.prompt(null, title, msg, box, null, {});
        return ok ? box.value : "";
      } catch (e) {
        try {
          return Zotero.getMainWindow().prompt(msg, def || "") || "";
        } catch (e2) {
          return "";
        }
      }
    };

    var clean = function (s) {
      return (s || "").replace(/\s+/g, " ").trim();
    };

    var scope = function (item) {
      var lib = Zotero.Libraries.get(item.libraryID);
      return lib && lib.isGroup ? "groups/" + lib.id : "library";
    };

    var describe = function (item) {
      var creators = item.getCreators();
      var author = "No author";
      if (creators.length === 1) {
        author = creators[0].lastName || creators[0].firstName || "No author";
      } else if (creators.length > 1) {
        author = (creators[0].lastName || creators[0].firstName) + " et al.";
      }
      var date = item.getField("date") || "";
      var m = date.match(/\d{4}/);
      var year = m ? m[0] : "n.d.";
      var outlet =
        item.getField("publicationTitle") ||
        item.getField("websiteTitle") ||
        item.getField("publisher") ||
        item.getField("blogTitle") ||
        "";
      return {
        label: author + " (" + year + ")",
        title: item.getField("title") || "Untitled",
        outlet: outlet,
        link: "zotero://select/" + scope(item) + "/items/" + item.key
      };
    };

    var harvest = async function (item) {
      var source = describe(item);
      var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();
      var out = [];
      var skipped = [];
      for (var i = 0; i < attIDs.length; i++) {
        var att = Zotero.Items.get(attIDs[i]);
        if (!att) {
          try {
            att = await Zotero.Items.getAsync(attIDs[i]);
          } catch (e) {
            continue;
          }
        }
        if (!att) continue;
        var anns = [];
        try {
          anns = att.getAnnotations() || [];
        } catch (e) {
          anns = [];
        }
        for (var j = 0; j < anns.length; j++) {
          var ann = anns[j];
          var text = clean(ann.annotationText);
          var memo = clean(ann.annotationComment);
          var codes = ann
            .getTags()
            .map(function (t) { return t.tag; })
            .filter(function (t) { return t && t.indexOf("zotero://") !== 0; });
          if (!codes.length) continue;
          // Coded, but nothing to quote. Usually an image or area annotation.
          // Record it so the report can say so instead of dropping it silently.
          if (!text && !memo) {
            skipped.push({ codes: codes, source: source });
            continue;
          }
          out.push({
            text: text,
            memo: memo,
            codes: codes,
            source: source,
            page: ann.annotationPageLabel || "",
            link:
              "zotero://open/" + scope(item) + "/items/" +
              att.key + "?annotation=" + ann.key
          });
        }
      }
      return { source: source, extracts: out, skipped: skipped };
    };

    var renderExtract = function (e, showCodes) {
      var lines = [];
      lines.push(e.text ? "> " + e.text : "> *(no highlighted text, memo only)*");
      lines.push("> ");
      var cite = "> [" + e.source.label + "](" + e.link + ")";
      if (e.source.outlet) cite += ", *" + e.source.outlet + "*";
      if (e.page) cite += ", p. " + e.page;
      lines.push(cite);
      if (e.memo) {
        lines.push("> ");
        lines.push("> **Memo:** " + e.memo);
      }
      if (showCodes && e.codes.length > 1) {
        lines.push("> ");
        lines.push("> *Also coded:* " + e.codes.join(", "));
      }
      return lines.join("\n");
    };

    var findCollection = function (libraryID, name) {
      var all = [];
      try {
        all = Zotero.Collections.getByLibrary(libraryID, true) || [];
      } catch (e) {
        all = [];
      }
      var want = name.toLowerCase();
      for (var i = 0; i < all.length; i++) {
        if ((all[i].name || "").toLowerCase() === want) return all[i];
      }
      for (var k = 0; k < all.length; k++) {
        if ((all[k].name || "").toLowerCase().indexOf(want) !== -1) return all[k];
      }
      return null;
    };

    // ---------- resolve the scope ----------
    var pane = null;
    try {
      pane = Zotero.getActiveZoteroPane();
    } catch (e) {
      pane = null;
    }
    if (!pane) {
      try {
        pane = Zotero.getMainWindow().ZoteroPane;
      } catch (e) {
        pane = null;
      }
    }

    var coll = null;
    if (pane && typeof pane.getSelectedCollection === "function") {
      try {
        coll = pane.getSelectedCollection() || null;
      } catch (e) {
        coll = null;
      }
    }

    var libraryID = coll ? coll.libraryID : Zotero.Libraries.userLibraryID;
    var wholeLibrary = false;

    if (!coll && !_env.dryRun) {
      var typed = clean(
        ask(
          "Code Report",
          "No collection is highlighted in the left pane. Type a collection name to scan, or type * to scan the entire library.",
          ""
        )
      );
      if (typed === "*") {
        wholeLibrary = true;
      } else if (typed) {
        coll = findCollection(libraryID, typed);
        if (!coll) {
          return "> No collection named **" + typed +
            "** was found. Check the spelling, or click the collection in the left pane before running this template.";
        }
      } else {
        return "> Nothing to scan. Click a collection in the left pane and run this template again, or type a collection name at the prompt.";
      }
    }

    // ---------- gather top-level items ----------
    var items = [];
    var seenIDs = new Set();
    var keep = function (it) {
      if (!it || seenIDs.has(it.id)) return;
      if (it.isNote && it.isNote()) return;
      if (it.isAnnotation && it.isAnnotation()) return;
      if (it.isAttachment && it.isAttachment() && it.parentItemID) return;
      seenIDs.add(it.id);
      items.push(it);
    };

    var scopeName = "Entire library";
    if (wholeLibrary) {
      var all = await Zotero.Items.getAll(libraryID, true);
      for (var a = 0; a < all.length; a++) keep(all[a]);
    } else {
      scopeName = coll.name;
      var walk = function (c) {
        var kids = [];
        try { kids = c.getChildItems() || []; } catch (e) { kids = []; }
        for (var i = 0; i < kids.length; i++) keep(kids[i]);
        var subs = [];
        try { subs = c.getChildCollections() || []; } catch (e) { subs = []; }
        for (var j = 0; j < subs.length; j++) walk(subs[j]);
      };
      walk(coll);
    }

    // ---------- harvest ----------
    var byCode = {};
    var uncoded = [];
    var skippedAll = [];
    var codedSources = 0;
    for (var n = 0; n < items.length; n++) {
      var res = await harvest(items[n]);
      for (var s = 0; s < res.skipped.length; s++) skippedAll.push(res.skipped[s]);
      if (!res.extracts.length) {
        uncoded.push(res.source);
        continue;
      }
      codedSources += 1;
      for (var x = 0; x < res.extracts.length; x++) {
        var ex = res.extracts[x];
        for (var y = 0; y < ex.codes.length; y++) {
          var c = ex.codes[y];
          if (!byCode[c]) byCode[c] = [];
          byCode[c].push(ex);
        }
      }
    }

    // ---------- render ----------
    var codes = Object.keys(byCode).sort(function (a, b) {
      return a.toLowerCase().localeCompare(b.toLowerCase());
    });
    var countSources = function (list) {
      var s = new Set(list.map(function (e) { return e.source.link; }));
      return s.size;
    };

    var out = [];
    out.push("*Scanned " + scopeName + ", " + new Date().toLocaleString() + "*");
    out.push("");
    out.push("**Sources scanned:** " + items.length + "  ");
    out.push("**Sources with coded extracts:** " + codedSources + "  ");
    out.push("**Distinct codes:** " + codes.length);
    out.push("");

    if (skippedAll.length) {
      var skCodes = new Set();
      for (var q = 0; q < skippedAll.length; q++) {
        skippedAll[q].codes.forEach(function (c) { skCodes.add(c); });
      }
      out.push("> **" + skippedAll.length + " coded annotation(s) skipped.** They have neither highlighted text nor a memo, so there is nothing to quote. These are usually image or area annotations. Add a memo to the annotation if you want it to appear here. Codes affected: " + Array.from(skCodes).sort().join(", "));
      out.push("");
    }

    if (!codes.length) {
      out.push("> No tagged highlights were found. Highlight a passage in the Zotero reader, then add a tag to that highlight in the annotation sidebar. A highlight with no tag is not a code.");
      return out.join("\n");
    }

    out.push("## Codebook at a glance");
    out.push("");
    out.push("| Code | Extracts | Sources |");
    out.push("| :-- | --: | --: |");
    for (var i2 = 0; i2 < codes.length; i2++) {
      var l1 = byCode[codes[i2]];
      out.push("| " + codes[i2] + " | " + l1.length + " | " + countSources(l1) + " |");
    }
    out.push("");
    out.push("## Extracts by code");
    for (var k2 = 0; k2 < codes.length; k2++) {
      var l2 = byCode[codes[k2]];
      out.push("");
      out.push("### " + codes[k2]);
      out.push("");
      out.push("*" + l2.length + " extract(s) across " + countSources(l2) + " source(s)*");
      for (var p2 = 0; p2 < l2.length; p2++) {
        out.push("");
        out.push(renderExtract(l2[p2], true));
      }
    }

    if (uncoded.length) {
      out.push("");
      out.push("## Sources with no coded extracts");
      out.push("");
      for (var u = 0; u < uncoded.length; u++) {
        out.push("- [" + uncoded[u].label + "](" + uncoded[u].link + ") " + uncoded[u].title);
      }
    }

    return out.join("\n");
  }}$
