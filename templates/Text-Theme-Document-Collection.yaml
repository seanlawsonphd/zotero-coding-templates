# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Text] Theme Document (Collection)"
content: |-
  "// @author Sean Lawson, COMM 5610 IT & Global Conflict, University of Utah\n// @use-markdown\n${{\n  // Deliberately no @use-refresh here. This heading must stay outside the\n  // refreshable block so it survives refreshes and gives the note its title.\n  var name = \"Untitled theme\";\n  if (!_env.dryRun) {\n    var question =\n      \"Name this theme. Use a short phrase that states its central organizing \" +\n      \"concept, not a one-word topic label. This becomes the note name in your \" +\n      \"Zotero list.\";\n    try {\n      var box = { value: \"\" };\n      var ok = Services.prompt.prompt(null, \"Theme Document\", question, box, null, {});\n      if (ok && box.value.trim()) name = box.value.trim();\n    } catch (e) {\n      try {\n        var typed = Zotero.getMainWindow().prompt(question, \"\");\n        if (typed && typed.trim()) name = typed.trim();\n      } catch (e2) {\n        // keep the default\n      }\n    }\n  }\n  return \"# Theme: \" + name;\n}}$\n\n${await Zotero.BetterNotes.api.template.runTextTemplate(\"[Text] Theme Document BODY (do not use)\", { targetNoteId: targetNoteItem ? targetNoteItem.id : undefined, dryRun: _env.dryRun })}"
