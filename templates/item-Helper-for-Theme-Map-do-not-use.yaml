# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[item] Helper for Theme Map (do not use)"
content: |-
  // @use-refresh
  // @beforeloop-begin
  // @use-markdown
  ${{
    var ask = function (title, msg, def) {
      try {
        var box = { value: def || "" };
        var ok = Services.prompt.prompt(null, title, msg, box, null, {});
        return ok ? box.value : "";
      } catch (e) {
        try {
          return Zotero.getMainWindow().prompt(msg, def || "") || "";
        } catch (e2) {
          return "";
        }
      }
    };

    var clean = function (s) {
      return (s || "").replace(/\s+/g, " ").trim();
    };

    var scope = function (item) {
      var lib = Zotero.Libraries.get(item.libraryID);
      return lib && lib.isGroup ? "groups/" + lib.id : "library";
    };

    // Full reference for a source, in APA style. Change the style id below to use
    // another installed citation style.
    var citeFormat = "bibliography=http://www.zotero.org/styles/apa";
    var citeCache = {};
    var mdEscape = function (s) {
      return (s || "").replace(/([\\\x60*_\[\]<>])/g, "\\$1");
    };
    var fullCite = function (item, fallback) {
      var target = item;
      try {
        if (item.isAttachment() && item.parentItemID) {
          target = Zotero.Items.get(item.parentItemID) || item;
        }
      } catch (e) {
        target = item;
      }
      if (citeCache[target.id]) return citeCache[target.id];
      var text = "";
      try {
        if (target.isRegularItem()) {
          var res = Zotero.QuickCopy.getContentFromItems([target], citeFormat);
          text = ((res && res.text) || "").replace(/\s+/g, " ").trim();
        }
      } catch (e) {
        text = "";
      }
      if (!text) text = fallback;
      citeCache[target.id] = text;
      return text;
    };

    var describe = function (item) {
      var creators = item.getCreators();
      var author = "No author";
      if (creators.length === 1) {
        author = creators[0].lastName || creators[0].firstName || "No author";
      } else if (creators.length > 1) {
        author = (creators[0].lastName || creators[0].firstName) + " et al.";
      }
      var date = item.getField("date") || "";
      var m = date.match(/\d{4}/);
      var year = m ? m[0] : "n.d.";
      var outlet =
        item.getField("publicationTitle") ||
        item.getField("websiteTitle") ||
        item.getField("publisher") ||
        item.getField("blogTitle") ||
        "";
      return {
        label: author + " (" + year + ")",
        title: item.getField("title") || "Untitled",
        outlet: outlet,
        link: "zotero://select/" + scope(item) + "/items/" + item.key,
        cite: fullCite(
          item,
          author + " (" + year + "). " + (item.getField("title") || "Untitled") +
            (outlet ? ". " + outlet : "") + "."
        )
      };
    };

    var harvest = async function (item) {
      var source = describe(item);
      var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();
      var out = [];
      var skipped = [];
      var untagged = [];
      for (var i = 0; i < attIDs.length; i++) {
        var att = Zotero.Items.get(attIDs[i]);
        if (!att) {
          try {
            att = await Zotero.Items.getAsync(attIDs[i]);
          } catch (e) {
            continue;
          }
        }
        if (!att) continue;
        var anns = [];
        try {
          anns = att.getAnnotations() || [];
        } catch (e) {
          anns = [];
        }
        for (var j = 0; j < anns.length; j++) {
          var ann = anns[j];
          var text = clean(ann.annotationText);
          var memo = clean(ann.annotationComment);
          var codes = ann
            .getTags()
            .map(function (t) { return t.tag; })
            .filter(function (t) { return t && t.indexOf("zotero://") !== 0; });
          var link =
            "zotero://open/" + scope(item) + "/items/" +
            att.key + "?annotation=" + ann.key;
          var who = "";
          try {
            who = ann.annotationAuthorName || "";
            if (!who && ann.createdByUserID) who = Zotero.Users.getName(ann.createdByUserID) || "";
          } catch (e) {
            who = "";
          }
          if (!codes.length) {
            if (text || memo) {
              untagged.push({
                text: text, memo: memo, codes: [], source: source,
                page: ann.annotationPageLabel || "", link: link, author: who, att: att.key
              });
            }
            continue;
          }
          // Coded, but nothing to quote. Usually an image or area annotation.
          // Record it so the report can say so instead of dropping it silently.
          if (!text && !memo) {
            skipped.push({ codes: codes, source: source });
            continue;
          }
          out.push({
            text: text,
            memo: memo,
            codes: codes,
            source: source,
            page: ann.annotationPageLabel || "",
            link: link,
            author: who,
            att: att.key
          });
        }
      }
      return { source: source, extracts: out, skipped: skipped, untagged: untagged };
    };

    var renderExtract = function (e, showCodes) {
      var lines = [];
      lines.push(e.text ? "> " + e.text : "> *(no highlighted text, memo only)*");
      lines.push("> ");
      var cite = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) cite += " (p. " + e.page + ")";
      cite += " [\\[Open highlight\\]](" + e.link + ")";
      lines.push(cite);
      if (e.memo) {
        lines.push("> ");
        lines.push("> **Memo:** " + e.memo);
      }
      if (showCodes && e.codes.length > 1) {
        lines.push("> ");
        lines.push("> *Also coded:* " + e.codes.join(", "));
      }
      return lines.join("\n");
    };

    var findCollection = function (libraryID, name) {
      var all = [];
      try {
        all = Zotero.Collections.getByLibrary(libraryID, true) || [];
      } catch (e) {
        all = [];
      }
      var want = name.toLowerCase();
      for (var i = 0; i < all.length; i++) {
        if ((all[i].name || "").toLowerCase() === want) return all[i];
      }
      for (var k = 0; k < all.length; k++) {
        if ((all[k].name || "").toLowerCase().indexOf(want) !== -1) return all[k];
      }
      return null;
    };

    // ---------- combining codes ----------
    // A Boolean expression over an extract's own codes. Operators are AND, OR and
    // NOT in capital letters, with parentheses for grouping. Anything else is a
    // code name; put a code in double quotes if it contains an operator word.
    var parseFilter = function (text) {
      var tokens = [];
      var buf = "";
      var flush = function () {
        var name = buf.replace(/\s+/g, " ").trim();
        if (name) tokens.push({ t: "code", v: name.toLowerCase(), raw: name });
        buf = "";
      };
      var i = 0;
      while (i < text.length) {
        var ch = text[i];
        if (ch === "\"" || ch === "“" || ch === "”") {
          var end = i + 1;
          while (end < text.length && !/["“”]/.test(text[end])) end++;
          flush();
          buf = text.slice(i + 1, end);
          flush();
          i = end + 1;
          continue;
        }
        if (ch === "(" || ch === ")") {
          flush();
          tokens.push({ t: ch });
          i++;
          continue;
        }
        // A plus sign with a space on each side means AND, so a pair copied
        // from a Code Matrix ("a + b") can be pasted in as is.
        if (ch === "+" && (i === 0 || /\s/.test(text[i - 1])) && (i + 1 >= text.length || /\s/.test(text[i + 1]))) {
          flush();
          tokens.push({ t: "AND" });
          i++;
          continue;
        }
        var m = text.slice(i).match(/^(AND|OR|NOT)(?![A-Za-z0-9_])/);
        if (m && (i === 0 || /[\s()]/.test(text[i - 1]))) {
          flush();
          tokens.push({ t: m[1] });
          i += m[1].length;
          continue;
        }
        buf += ch;
        i++;
      }
      flush();

      var pos = 0;
      var codes = [];
      var positive = [];
      var negDepth = 0;
      var peek = function () { return tokens[pos] ? tokens[pos].t : null; };
      var parseAtom = function () {
        var tk = tokens[pos];
        if (!tk) throw new Error("it ends too early");
        if (tk.t === "(") {
          pos++;
          var inner = parseOr();
          if (peek() !== ")") throw new Error("a closing parenthesis is missing");
          pos++;
          return inner;
        }
        if (tk.t === "code") {
          pos++;
          codes.push(tk.raw);
          if (negDepth % 2 === 0) positive.push(tk.raw);
          var v = tk.v;
          return function (set) { return set.has(v); };
        }
        throw new Error("there is an unexpected " + tk.t);
      };
      var parseNot = function () {
        if (peek() === "NOT") {
          pos++;
          negDepth++;
          var negated = parseNot();
          negDepth--;
          return function (set) { return !negated(set); };
        }
        return parseAtom();
      };
      var parseAnd = function () {
        var left = parseNot();
        while (peek() === "AND") {
          pos++;
          left = (function (a, b) {
            return function (set) { return a(set) && b(set); };
          })(left, parseNot());
        }
        return left;
      };
      var parseOr = function () {
        var left = parseAnd();
        while (peek() === "OR") {
          pos++;
          left = (function (a, b) {
            return function (set) { return a(set) || b(set); };
          })(left, parseAnd());
        }
        return left;
      };
      try {
        var test = parseOr();
        if (pos < tokens.length) {
          throw new Error("there is an unexpected " + (tokens[pos].raw || tokens[pos].t));
        }
        return { test: test, codes: codes, positive: positive, error: "" };
      } catch (e) {
        return { test: null, codes: codes, positive: positive, error: e.message };
      }
    };

    // Reads the "Codes in this theme" line. Commas separate alternatives; each
    // alternative is a single code or an expression such as: a AND NOT b
    var parseCodesLine = function (text) {
      var raw = (text || "").replace(/\s+/g, " ").trim();
      var hasOps = function (s) {
        return /(^|[\s(])(AND|OR|NOT)(?=[\s(]|$)/.test(s) || /[()]/.test(s) || /(^|\s)\+(\s|$)/.test(s);
      };
      var spec = { raw: raw, declared: [], mentioned: [], usesLogic: false, errors: [] };
      var tests = [];
      var add = function (list, name) {
        var low = name.toLowerCase();
        if (!list.some(function (x) { return x.toLowerCase() === low; })) list.push(name);
      };
      raw.split(",").forEach(function (part) {
        part = part.trim();
        if (!part) return;
        if (!hasOps(part)) {
          var name = part.replace(/^["“]|["”]$/g, "").trim();
          if (!name) return;
          add(spec.declared, name);
          add(spec.mentioned, name);
          var low = name.toLowerCase();
          tests.push(function (set) { return set.has(low); });
          return;
        }
        spec.usesLogic = true;
        var parsed = parseFilter(part);
        if (parsed.error) {
          spec.errors.push(part + " (" + parsed.error + ")");
          return;
        }
        parsed.positive.forEach(function (c) { add(spec.declared, c); });
        parsed.codes.forEach(function (c) { add(spec.mentioned, c); });
        tests.push(parsed.test);
      });
      spec.test = function (set) {
        return tests.some(function (f) { return f(set); });
      };
      return spec;
    };

    // The sources are the items this template was run on (kept in the block
    // header, so a refresh scans the same items). Selected notes are set aside.
    var noteItems = items.filter(function (it) { return it.isNote && it.isNote(); });
    var scanItems = items.filter(function (it) { return !(it.isNote && it.isNote()); });


    // ---------- harvest ----------
    var byCode = {};
    var uncoded = [];
    var skippedAll = [];
    var codedSources = 0;
    var sourceList = [];
    var allEx = [];
    var untaggedAll = [];
    for (var n = 0; n < scanItems.length; n++) {
      var res = await harvest(scanItems[n]);
      sourceList.push(res.source);
      res.untagged.forEach(function (u) { untaggedAll.push(u); });
      res.extracts.forEach(function (e0) { allEx.push(e0); });
      for (var s = 0; s < res.skipped.length; s++) skippedAll.push(res.skipped[s]);
      if (!res.extracts.length) {
        uncoded.push(res.source);
        continue;
      }
      codedSources += 1;
      for (var x = 0; x < res.extracts.length; x++) {
        var ex = res.extracts[x];
        for (var y = 0; y < ex.codes.length; y++) {
          var c = ex.codes[y];
          if (!byCode[c]) byCode[c] = [];
          byCode[c].push(ex);
        }
      }
    }

    // ---------- render ----------
    var ci = function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); };
    var codes = Object.keys(byCode).sort(ci);
    var countSources = function (list) {
      var s = new Set(list.map(function (e) { return e.source.link; }));
      return s.size;
    };
    var cell = function (text) { return String(text).replace(/\|/g, "\\|"); };
    var shorten = function (text, max) {
      text = String(text || "");
      return text.length > max ? text.slice(0, max - 1).trim() + "\u2026" : text;
    };
    var cite = function (e) {
      var line = "> **Source:** " + mdEscape(e.source.cite);
      if (e.page) line += " (p. " + e.page + ")";
      return line + " [\\[Open highlight\\]](" + e.link + ")";
    };
    var scannedLabel = scanItems.length + " selected item(s)";
    var out = [];
    var lower = function (list) { return new Set(list.map(function (c) { return c.toLowerCase(); })); };
    var themes = [];
    noteItems.forEach(function (n) {
      if (targetNoteItem && n.id === targetNoteItem.id) return;
      var html = "";
      try { html = n.getNote() || ""; } catch (e) { html = ""; }
      var plain = html
        .replace(/<[^>]+>/g, "\n")
        .replace(/&nbsp;/g, " ")
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, "\"")
        .replace(/&#39;/g, "'");
      var m = plain.match(/Codes in this theme:\s*([^\n]*)/);
      if (!m) return;
      var line = clean(m[1]);
      if (line.indexOf("(none yet)") !== -1) line = "";
      var title = "";
      try { title = n.getNoteTitle() || ""; } catch (e) { title = ""; }
      title = clean(title.replace(/^Theme:\s*/i, "")) || "Untitled theme";
      var spec = parseCodesLine(line);
      var matched = allEx.filter(function (e) { return spec.test(lower(e.codes)); });
      themes.push({
        title: title, line: line, spec: spec, matched: matched,
        link: "zotero://select/" + scope(n) + "/items/" + n.key
      });
    });
    themes.sort(function (a, b) { return ci(a.title, b.title); });
    out.push("<span style=\"color: #e03131\"><em><strong>Everything from here down to the line below Analytical Notes is regenerated every time you refresh this note.</strong> Do not type inside it. Write your own notes below that line, or a refresh will erase them.</em></span>");
    out.push("");
    out.push("## Scope");
    out.push("");
    out.push("- **" + "Built from " + themes.length + " theme(s), " + codes.length + " code(s), and " + allEx.length + " extract(s), out of " + scanItems.length + " sources scanned." + "**");
    out.push("- **Scanned:** " + scannedLabel);
    var shown = sourceList.slice(0, 50);
    for (var s2 = 0; s2 < shown.length; s2++) {
      out.push("  - " + mdEscape(shown[s2].cite));
    }
    if (sourceList.length > shown.length) {
      out.push("  - and " + (sourceList.length - shown.length) + " more");
    }
    out.push("- **Generated:** " + new Date().toLocaleString());
    out.push("");
    out.push("## Themes");
    out.push("");
    if (!themes.length) {
      out.push("> No Theme Documents were found in what you selected. Select the theme notes together with their sources, then run this template. Make a Theme Document first, then refresh this note.");
    } else {
      out.push("| Theme | Codes | Extracts | Sources |");
      out.push("| :-- | :-- | :-: | :-: |");
      themes.forEach(function (t) {
        out.push("| [" + cell(mdEscape(t.title)) + "](" + t.link + ") | " + (t.line ? cell(t.line) : "*none yet*") + " | " + t.matched.length + " | " + countSources(t.matched) + " |");
      });
    }

    var themesFor = function (c) {
      var low = c.toLowerCase();
      return themes.filter(function (t) {
        return t.spec.declared.some(function (d) { return d.toLowerCase() === low; });
      }).map(function (t) { return t.title; });
    };
    if (codes.length) {
      out.push("");
      out.push("## Codes and their themes");
      out.push("");
      out.push("| Code | Extracts | Themes |");
      out.push("| :-- | :-: | :-- |");
      codes.forEach(function (c) {
        var names = themesFor(c);
        out.push("| **" + cell(c) + "** | " + byCode[c].length + " | " + (names.length ? cell(names.join("; ")) : "*none*") + " |");
      });
    }

    var codeSet = lower(codes);
    var orphan = codes.filter(function (c) { return !themesFor(c).length; });
    var shared = codes.filter(function (c) { return themesFor(c).length > 1; });
    var unknown = [];
    themes.forEach(function (t) {
      t.spec.mentioned.forEach(function (c) {
        if (!codeSet.has(c.toLowerCase())) unknown.push(c + " (" + t.title + ")");
      });
    });
    var covered = new Set();
    themes.forEach(function (t) { t.matched.forEach(function (e) { covered.add(e.link); }); });
    out.push("");
    out.push("## Check these");
    out.push("");
    out.push("- **Codes not in any theme:** " + (orphan.length ? orphan.join(", ") : "none"));
    out.push("- **Codes in more than one theme:** " + (shared.length ? shared.map(function (c) { return c + " (" + themesFor(c).join("; ") + ")"; }).join(", ") : "none"));
    out.push("- **Codes named in a theme but not found in the sources:** " + (unknown.length ? unknown.join(", ") : "none"));
    out.push("- **Coded extracts not covered by any theme:** " + (allEx.length - covered.size) + " of " + allEx.length);
    out.push("");
    out.push("## Analytical Notes");
    out.push("");
    out.push("*Write your thoughts about how the themes fit together after the line below. For example, note codes that belong in no theme, themes that overlap and might merge, and gaps the themes leave uncovered.*");
    return out.join("\n");
  }}$
  // @beforeloop-end
  // @default-begin
  // @default-end
