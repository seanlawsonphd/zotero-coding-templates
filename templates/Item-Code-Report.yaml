# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Item] Code Report"
content: |-
  // @beforeloop-begin
  ${{
    // This outer template is not refreshable on purpose. It writes the title
    // line, which becomes the note name, and the writing heading at the end.
    // The refreshable part in between comes from the BODY template.
    var title = "Code Report";
    if (!_env.dryRun) {
      var question = "Title for this note. This becomes the note name in your Zotero list.";
      try {
        var box = { value: "Code Report" };
        var ok = Services.prompt.prompt(null, "Code Report", question, box, null, {});
        if (ok && box.value.trim()) title = box.value.trim();
      } catch (e) {
        try {
          var typed = Zotero.getMainWindow().prompt(question, "Code Report");
          if (typed && typed.trim()) title = typed.trim();
        } catch (e2) {
          // keep the default
        }
      }
    }
    var esc = title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var body = await Zotero.BetterNotes.api.template.runItemTemplate(
      "[Item] Code Report BODY (do not use)",
      {
        itemIds: items.map(function (item) { return item.id; }),
        targetNoteId: targetNoteItem ? targetNoteItem.id : undefined,
        dryRun: _env.dryRun
      }
    );
    return "<h1>" + esc + "</h1>\n" + body + "\n" + "<h3>Insights &amp; Observations</h3>\n<p></p>\n<p></p>";
  }}$
  // @beforeloop-end
  // @default-begin
  // @default-end
