# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Item] Code Report"
content: |-
  "// @author Sean Lawson, COMM 5610 IT & Global Conflict, University of Utah\n// @use-refresh\n// @beforeloop-begin\n// @use-markdown\n${{\n  sharedObj.byCode = {};\n  sharedObj.sources = 0;\n  sharedObj.codedSources = 0;\n  sharedObj.uncoded = [];\n  sharedObj.skipped = [];\n\n  sharedObj.scope = function (item) {\n    var lib = Zotero.Libraries.get(item.libraryID);\n    return lib && lib.isGroup ? \"groups/\" + lib.id : \"library\";\n  };\n\n  sharedObj.clean = function (s) {\n    return (s || \"\").replace(/\\s+/g, \" \").trim();\n  };\n\n  sharedObj.describe = function (item) {\n    var creators = item.getCreators();\n    var author = \"No author\";\n    if (creators.length === 1) {\n      author = creators[0].lastName || creators[0].firstName || \"No author\";\n    } else if (creators.length > 1) {\n      author = (creators[0].lastName || creators[0].firstName) + \" et al.\";\n    }\n    var date = item.getField(\"date\") || \"\";\n    var m = date.match(/\\d{4}/);\n    var year = m ? m[0] : \"n.d.\";\n    var outlet =\n      item.getField(\"publicationTitle\") ||\n      item.getField(\"websiteTitle\") ||\n      item.getField(\"publisher\") ||\n      item.getField(\"blogTitle\") ||\n      \"\";\n    return {\n      label: author + \" (\" + year + \")\",\n      title: item.getField(\"title\") || \"Untitled\",\n      outlet: outlet,\n      link: \"zotero://select/\" + sharedObj.scope(item) + \"/items/\" + item.key\n    };\n  };\n\n  sharedObj.harvest = async function (item) {\n    var source = sharedObj.describe(item);\n    var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();\n    var out = [];\n    var skipped = [];\n    for (var i = 0; i < attIDs.length; i++) {\n      var att = Zotero.Items.get(attIDs[i]);\n      if (!att) {\n        try {\n          att = await Zotero.Items.getAsync(attIDs[i]);\n        } catch (e) {\n          continue;\n        }\n      }\n      if (!att) continue;\n      var anns = [];\n      try {\n        anns = att.getAnnotations() || [];\n      } catch (e) {\n        anns = [];\n      }\n      for (var j = 0; j < anns.length; j++) {\n        var ann = anns[j];\n        var text = sharedObj.clean(ann.annotationText);\n        var memo = sharedObj.clean(ann.annotationComment);\n        var codes = ann\n          .getTags()\n          .map(function (t) { return t.tag; })\n          .filter(function (t) { return t && t.indexOf(\"zotero://\") !== 0; });\n        if (!codes.length) continue;\n        // Coded, but nothing to quote. Usually an image or area annotation.\n        // Record it so the report can say so instead of dropping it silently.\n        if (!text && !memo) {\n          skipped.push({ codes: codes, source: source });\n          continue;\n        }\n        out.push({\n          text: text,\n          memo: memo,\n          codes: codes,\n          source: source,\n          page: ann.annotationPageLabel || \"\",\n          link:\n            \"zotero://open/\" + sharedObj.scope(item) + \"/items/\" +\n            att.key + \"?annotation=\" + ann.key\n        });\n      }\n    }\n    return { source: source, extracts: out, skipped: skipped };\n  };\n\n  sharedObj.renderExtract = function (e, showCodes) {\n    var lines = [];\n    lines.push(e.text ? \"> \" + e.text : \"> *(no highlighted text, memo only)*\");\n    lines.push(\"> \");\n    var cite = \"> [\" + e.source.label + \"](\" + e.link + \")\";\n    if (e.source.outlet) cite += \", *\" + e.source.outlet + \"*\";\n    if (e.page) cite += \", p. \" + e.page;\n    lines.push(cite);\n    if (e.memo) {\n      lines.push(\"> \");\n      lines.push(\"> **Memo:** \" + e.memo);\n    }\n    if (showCodes && e.codes.length > 1) {\n      lines.push(\"> \");\n      lines.push(\"> *Also coded:* \" + e.codes.join(\", \"));\n    }\n    return lines.join(\"\\n\");\n  };\n\n  return \"# Code Report\\n\\nGenerated \" + new Date().toLocaleString() + \"\\n\";\n}}$\n// @beforeloop-end\n// @default-begin\n// @use-markdown\n${{\n  sharedObj.sources += 1;\n  var res = await sharedObj.harvest(topItem);\n  for (var s = 0; s < res.skipped.length; s++) {\n    sharedObj.skipped.push(res.skipped[s]);\n  }\n  if (!res.extracts.length) {\n    sharedObj.uncoded.push(res.source);\n    return \"\";\n  }\n  sharedObj.codedSources += 1;\n  for (var i = 0; i < res.extracts.length; i++) {\n    var e = res.extracts[i];\n    for (var j = 0; j < e.codes.length; j++) {\n      var c = e.codes[j];\n      if (!sharedObj.byCode[c]) sharedObj.byCode[c] = [];\n      sharedObj.byCode[c].push(e);\n    }\n  }\n  return \"\";\n}}$\n// @default-end\n// @afterloop-begin\n// @use-markdown\n${{\n  var codes = Object.keys(sharedObj.byCode).sort(function (a, b) {\n    return a.toLowerCase().localeCompare(b.toLowerCase());\n  });\n  var out = [];\n  var countSources = function (ex) {\n    var s = new Set(ex.map(function (e) { return e.source.link; }));\n    return s.size;\n  };\n\n  out.push(\"**Sources processed:** \" + sharedObj.sources + \"  \");\n  out.push(\"**Sources with coded extracts:** \" + sharedObj.codedSources + \"  \");\n  out.push(\"**Distinct codes:** \" + codes.length);\n  out.push(\"\");\n\n  if (sharedObj.skipped.length) {\n    var skCodes = new Set();\n    for (var q = 0; q < sharedObj.skipped.length; q++) {\n      sharedObj.skipped[q].codes.forEach(function (c) { skCodes.add(c); });\n    }\n    out.push(\"> **\" + sharedObj.skipped.length + \" coded annotation(s) skipped.** They have neither highlighted text nor a memo, so there is nothing to quote. These are usually image or area annotations. Add a memo to the annotation if you want it to appear here. Codes affected: \" + Array.from(skCodes).sort().join(\", \"));\n    out.push(\"\");\n  }\n\n  if (!codes.length) {\n    out.push(\"> No tagged highlights were found in these sources. Highlight a passage in the Zotero reader, then add a tag to that highlight in the annotation sidebar. A highlight with no tag is not a code.\");\n    return out.join(\"\\n\");\n  }\n\n  out.push(\"## Codebook at a glance\");\n  out.push(\"\");\n  out.push(\"| Code | Extracts | Sources |\");\n  out.push(\"| :-- | --: | --: |\");\n  for (var i = 0; i < codes.length; i++) {\n    var ex = sharedObj.byCode[codes[i]];\n    out.push(\"| \" + codes[i] + \" | \" + ex.length + \" | \" + countSources(ex) + \" |\");\n  }\n  out.push(\"\");\n  out.push(\"## Extracts by code\");\n  for (var k = 0; k < codes.length; k++) {\n    var list = sharedObj.byCode[codes[k]];\n    out.push(\"\");\n    out.push(\"### \" + codes[k]);\n    out.push(\"\");\n    out.push(\"*\" + list.length + \" extract(s) across \" + countSources(list) + \" source(s)*\");\n    for (var n = 0; n < list.length; n++) {\n      out.push(\"\");\n      out.push(sharedObj.renderExtract(list[n], true));\n    }\n  }\n\n  if (sharedObj.uncoded.length) {\n    out.push(\"\");\n    out.push(\"## Sources with no coded extracts\");\n    out.push(\"\");\n    for (var u = 0; u < sharedObj.uncoded.length; u++) {\n      var s = sharedObj.uncoded[u];\n      out.push(\"- [\" + s.label + \"](\" + s.link + \") \" + s.title);\n    }\n  }\n\n  return out.join(\"\\n\");\n}}$\n// @afterloop-end"
