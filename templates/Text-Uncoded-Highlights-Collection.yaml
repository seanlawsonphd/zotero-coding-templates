# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Text] Uncoded Highlights (Collection)"
content: |-
  ${{
    // This outer template is not refreshable on purpose. It writes the title
    // line, which becomes the note name. The refreshable part comes from the
    // BODY template.
    var body = await Zotero.BetterNotes.api.template.runTextTemplate(
      "[Text] Uncoded Highlights BODY (do not use)",
      {
        targetNoteId: targetNoteItem ? targetNoteItem.id : undefined,
        dryRun: _env.dryRun
      }
    );
    var title = "Uncoded Highlights";
    if (!_env.dryRun) {
      var question = "Title for this note. This becomes the note name in your Zotero list.";
      try {
        var box = { value: "Uncoded Highlights" };
        var ok = Services.prompt.prompt(null, "Uncoded Highlights", question, box, null, {});
        if (ok && box.value.trim()) title = box.value.trim();
      } catch (e) {
        try {
          var typed = Zotero.getMainWindow().prompt(question, "Uncoded Highlights");
          if (typed && typed.trim()) title = typed.trim();
        } catch (e2) {
          // keep the default
        }
      }
    }
    title = title.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var defs = "";
    return "<h1>" + title + "</h1>\n" + body + defs;
  }}$
