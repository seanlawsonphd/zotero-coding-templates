# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[item] Helper for Theme Document (do not use)"
content: |-
  // @use-refresh
  // @beforeloop-begin
  // @use-markdown
  ${{
    sharedObj.ask = function (title, msg, def) {
      try {
        var out = { value: def || "" };
        var ok = Services.prompt.prompt(null, title, msg, out, null, {});
        return ok ? out.value : "";
      } catch (e) {
        try {
          return Zotero.getMainWindow().prompt(msg, def || "") || "";
        } catch (e2) {
          return "";
        }
      }
    };

    var clean0 = function (s) { return (s || "").replace(/\s+/g, " ").trim(); };

    // On refresh, reuse the theme name and code list already recorded in the
    // note rather than prompting again. Editing that line in the note and
    // refreshing is how a student regroups codes into a different theme.
    // ---------- combining codes ----------
    // A Boolean expression over an extract's own codes. Operators are AND, OR and
    // NOT in capital letters, with parentheses for grouping. Anything else is a
    // code name; put a code in double quotes if it contains an operator word.
    var parseFilter = function (text) {
      var tokens = [];
      var buf = "";
      var flush = function () {
        var name = buf.replace(/\s+/g, " ").trim();
        if (name) tokens.push({ t: "code", v: name.toLowerCase(), raw: name });
        buf = "";
      };
      var i = 0;
      while (i < text.length) {
        var ch = text[i];
        if (ch === "\"" || ch === "“" || ch === "”") {
          var end = i + 1;
          while (end < text.length && !/["“”]/.test(text[end])) end++;
          flush();
          buf = text.slice(i + 1, end);
          flush();
          i = end + 1;
          continue;
        }
        if (ch === "(" || ch === ")") {
          flush();
          tokens.push({ t: ch });
          i++;
          continue;
        }
        // A plus sign with a space on each side means AND, so a pair copied
        // from a Code Matrix ("a + b") can be pasted in as is.
        if (ch === "+" && (i === 0 || /\s/.test(text[i - 1])) && (i + 1 >= text.length || /\s/.test(text[i + 1]))) {
          flush();
          tokens.push({ t: "AND" });
          i++;
          continue;
        }
        var m = text.slice(i).match(/^(AND|OR|NOT)(?![A-Za-z0-9_])/);
        if (m && (i === 0 || /[\s()]/.test(text[i - 1]))) {
          flush();
          tokens.push({ t: m[1] });
          i += m[1].length;
          continue;
        }
        buf += ch;
        i++;
      }
      flush();

      var pos = 0;
      var codes = [];
      var positive = [];
      var negDepth = 0;
      var peek = function () { return tokens[pos] ? tokens[pos].t : null; };
      var parseAtom = function () {
        var tk = tokens[pos];
        if (!tk) throw new Error("it ends too early");
        if (tk.t === "(") {
          pos++;
          var inner = parseOr();
          if (peek() !== ")") throw new Error("a closing parenthesis is missing");
          pos++;
          return inner;
        }
        if (tk.t === "code") {
          pos++;
          codes.push(tk.raw);
          if (negDepth % 2 === 0) positive.push(tk.raw);
          var v = tk.v;
          return function (set) { return set.has(v); };
        }
        throw new Error("there is an unexpected " + tk.t);
      };
      var parseNot = function () {
        if (peek() === "NOT") {
          pos++;
          negDepth++;
          var negated = parseNot();
          negDepth--;
          return function (set) { return !negated(set); };
        }
        return parseAtom();
      };
      var parseAnd = function () {
        var left = parseNot();
        while (peek() === "AND") {
          pos++;
          left = (function (a, b) {
            return function (set) { return a(set) && b(set); };
          })(left, parseNot());
        }
        return left;
      };
      var parseOr = function () {
        var left = parseAnd();
        while (peek() === "OR") {
          pos++;
          left = (function (a, b) {
            return function (set) { return a(set) || b(set); };
          })(left, parseAnd());
        }
        return left;
      };
      try {
        var test = parseOr();
        if (pos < tokens.length) {
          throw new Error("there is an unexpected " + (tokens[pos].raw || tokens[pos].t));
        }
        return { test: test, codes: codes, positive: positive, error: "" };
      } catch (e) {
        return { test: null, codes: codes, positive: positive, error: e.message };
      }
    };

    // Reads the "Codes in this theme" line. Commas separate alternatives; each
    // alternative is a single code or an expression such as: a AND NOT b
    var parseCodesLine = function (text) {
      var raw = (text || "").replace(/\s+/g, " ").trim();
      var hasOps = function (s) {
        return /(^|[\s(])(AND|OR|NOT)(?=[\s(]|$)/.test(s) || /[()]/.test(s) || /(^|\s)\+(\s|$)/.test(s);
      };
      var spec = { raw: raw, declared: [], mentioned: [], usesLogic: false, errors: [] };
      var tests = [];
      var add = function (list, name) {
        var low = name.toLowerCase();
        if (!list.some(function (x) { return x.toLowerCase() === low; })) list.push(name);
      };
      raw.split(",").forEach(function (part) {
        part = part.trim();
        if (!part) return;
        if (!hasOps(part)) {
          var name = part.replace(/^["“]|["”]$/g, "").trim();
          if (!name) return;
          add(spec.declared, name);
          add(spec.mentioned, name);
          var low = name.toLowerCase();
          tests.push(function (set) { return set.has(low); });
          return;
        }
        spec.usesLogic = true;
        var parsed = parseFilter(part);
        if (parsed.error) {
          spec.errors.push(part + " (" + parsed.error + ")");
          return;
        }
        parsed.positive.forEach(function (c) { add(spec.declared, c); });
        parsed.codes.forEach(function (c) { add(spec.mentioned, c); });
        tests.push(parsed.test);
      });
      spec.test = function (set) {
        return tests.some(function (f) { return f(set); });
      };
      return spec;
    };

    var prior = null;
    try {
      if (targetNoteItem && typeof targetNoteItem.getNote === "function") {
        var plain = (targetNoteItem.getNote() || "")
          .replace(/<[^>]+>/g, "\n")
          .replace(/&nbsp;/g, " ")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, "\"")
          .replace(/&#39;/g, "'");
        var mCodes = plain.match(/Codes in this theme:\s*([^\n]*)/);
        var mName = plain.match(/Theme:\s*([^\n]*)/);
        var priorCodes = mCodes ? clean0(mCodes[1]) : "";
        if (priorCodes && priorCodes.indexOf("(none yet)") === -1) {
          prior = { codes: priorCodes, name: mName ? clean0(mName[1]) : "" };
        }
      }
    } catch (e) {
      prior = null;
    }

    var themeName = "Untitled theme";
    var codeInput = "";
    if (prior) {
      themeName = prior.name || "Untitled theme";
      codeInput = prior.codes;
    } else if (!_env.dryRun) {
      codeInput = sharedObj.ask(
        "Theme Document",
        "Which codes belong to this theme? Separate them with commas, spelled exactly as you tagged them. You can edit this list in the note afterwards and refresh, so it does not have to be final. To combine codes, use AND, OR and NOT in capital letters, for example: fear appeal AND NOT humor. A plus sign also means AND, so you can paste a pair from a Code Matrix",
        ""
      );
    }

    sharedObj.theme = themeName;
    sharedObj.declared = codeInput
      .split(",")
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
    sharedObj.wanted = new Set(
      sharedObj.declared.map(function (c) { return c.toLowerCase(); })
    );
    sharedObj.byCode = {};
    sharedObj.spec = parseCodesLine(codeInput);
    sharedObj.declared = sharedObj.spec.declared;
    sharedObj.wanted = new Set(sharedObj.declared.map(function (c) { return c.toLowerCase(); }));
    sharedObj.seen = new Set();
    sharedObj.sources = 0;
    sharedObj.matchedSources = new Set();
    sharedObj.skipped = [];

    sharedObj.scope = function (item) {
      var lib = Zotero.Libraries.get(item.libraryID);
      return lib && lib.isGroup ? "groups/" + lib.id : "library";
    };

    sharedObj.clean = function (s) {
      return (s || "").replace(/\s+/g, " ").trim();
    };


    // Full reference for a source, in APA style. Change the style id below to use
    // another installed citation style.
    sharedObj.citeFormat = "bibliography=http://www.zotero.org/styles/apa";
    sharedObj.citeCache = {};
    sharedObj.mdEscape = function (s) {
      return (s || "").replace(/([\\\x60*_\[\]<>])/g, "\\$1");
    };
    sharedObj.fullCite = function (item, fallback) {
      var target = item;
      try {
        if (item.isAttachment() && item.parentItemID) {
          target = Zotero.Items.get(item.parentItemID) || item;
        }
      } catch (e) {
        target = item;
      }
      if (sharedObj.citeCache[target.id]) return sharedObj.citeCache[target.id];
      var text = "";
      try {
        if (target.isRegularItem()) {
          var res = Zotero.QuickCopy.getContentFromItems([target], sharedObj.citeFormat);
          text = ((res && res.text) || "").replace(/\s+/g, " ").trim();
        }
      } catch (e) {
        text = "";
      }
      if (!text) text = fallback;
      sharedObj.citeCache[target.id] = text;
      return text;
    };

    sharedObj.describe = function (item) {
      var creators = item.getCreators();
      var author = "No author";
      if (creators.length === 1) {
        author = creators[0].lastName || creators[0].firstName || "No author";
      } else if (creators.length > 1) {
        author = (creators[0].lastName || creators[0].firstName) + " et al.";
      }
      var date = item.getField("date") || "";
      var m = date.match(/\d{4}/);
      var year = m ? m[0] : "n.d.";
      var outlet =
        item.getField("publicationTitle") ||
        item.getField("websiteTitle") ||
        item.getField("publisher") ||
        item.getField("blogTitle") ||
        "";
      return {
        label: author + " (" + year + ")",
        title: item.getField("title") || "Untitled",
        outlet: outlet,
        link: "zotero://select/" + sharedObj.scope(item) + "/items/" + item.key,
        cite: sharedObj.fullCite(
          item,
          author + " (" + year + "). " + (item.getField("title") || "Untitled") +
            (outlet ? ". " + outlet : "") + "."
        )
      };
    };

    sharedObj.harvest = async function (item) {
      var source = sharedObj.describe(item);
      var attIDs = item.isAttachment() ? [item.id] : item.getAttachments();
      var out = [];
      var skipped = [];
      for (var i = 0; i < attIDs.length; i++) {
        var att = Zotero.Items.get(attIDs[i]);
        if (!att) {
          try {
            att = await Zotero.Items.getAsync(attIDs[i]);
          } catch (e) {
            continue;
          }
        }
        if (!att) continue;
        var anns = [];
        try {
          anns = att.getAnnotations() || [];
        } catch (e) {
          anns = [];
        }
        for (var j = 0; j < anns.length; j++) {
          var ann = anns[j];
          var text = sharedObj.clean(ann.annotationText);
          var memo = sharedObj.clean(ann.annotationComment);
          var codes = ann
            .getTags()
            .map(function (t) { return t.tag; })
            .filter(function (t) { return t && t.indexOf("zotero://") !== 0; });
          if (!codes.length) continue;
          // Coded, but nothing to quote. Usually an image or area annotation.
          // Record it so the report can say so instead of dropping it silently.
          if (!text && !memo) {
            skipped.push({ codes: codes, source: source });
            continue;
          }
          out.push({
            text: text,
            memo: memo,
            codes: codes,
            source: source,
            page: ann.annotationPageLabel || "",
            link:
              "zotero://open/" + sharedObj.scope(item) + "/items/" +
              att.key + "?annotation=" + ann.key
          });
        }
      }
      return { source: source, extracts: out, skipped: skipped };
    };

    sharedObj.renderExtract = function (e) {
      var lines = [];
      lines.push(e.text ? "> " + e.text : "> *(no highlighted text, memo only)*");
      lines.push("> ");
      var cite = "> **Source:** " + sharedObj.mdEscape(e.source.cite);
      if (e.page) cite += " (p. " + e.page + ")";
      cite += " [\\[Open highlight\\]](" + e.link + ")";
      lines.push(cite);
      if (e.memo) {
        lines.push("> ");
        lines.push("> **Memo:** " + e.memo);
      }
      lines.push("> ");
      lines.push("> **Codes:** " + e.codes.join(", "));
      return lines.join("\n");
    };

    sharedObj.sourceList = [];
    return "";
  }}$
  // @beforeloop-end
  // @default-begin
  // @use-markdown
  ${{
    sharedObj.sources += 1;
    var res = await sharedObj.harvest(topItem);
    sharedObj.sourceList.push(res.source);
    // Skipped annotations still count as codes seen, so a code that exists only
    // on image annotations is not reported as a typo.
    for (var s = 0; s < res.skipped.length; s++) {
      var sk = res.skipped[s];
      for (var t = 0; t < sk.codes.length; t++) {
        sharedObj.seen.add(sk.codes[t]);
        if (sharedObj.wanted.has(sk.codes[t].toLowerCase())) {
          sharedObj.skipped.push(sk);
        }
      }
    }
    for (var i = 0; i < res.extracts.length; i++) {
      var e = res.extracts[i];
      e.codes.forEach(function (c0) { sharedObj.seen.add(c0); });
      var exSet = new Set(e.codes.map(function (c0) { return c0.toLowerCase(); }));
      if (!sharedObj.spec.test(exSet)) continue;
      var listed = e.codes.filter(function (c0) { return sharedObj.wanted.has(c0.toLowerCase()); });
      // With AND/OR/NOT each extract is shown once; a plain list shows it
      // under every listed code it carries.
      var keys = sharedObj.spec.usesLogic ? [listed.length ? listed[0] : e.codes[0]] : listed;
      keys.forEach(function (c) {
        if (!sharedObj.byCode[c]) sharedObj.byCode[c] = [];
        sharedObj.byCode[c].push(e);
      });
      sharedObj.matchedSources.add(e.source.link);
    }
    return "";
  }}$
  // @default-end
  // @afterloop-begin
  // @use-markdown
  ${{
    // Codes appear in the order they are listed in "Codes in this theme", so
    // reordering that line regroups the evidence.
    var codes = [];
    var found = new Set();
    for (var d = 0; d < sharedObj.declared.length; d++) {
      var want = sharedObj.declared[d].toLowerCase();
      Object.keys(sharedObj.byCode).forEach(function (key) {
        if (key.toLowerCase() === want && codes.indexOf(key) === -1) {
          codes.push(key);
          found.add(want);
        }
      });
    }
    var seenLower = new Set(Array.from(sharedObj.seen).map(function (c) { return c.toLowerCase(); }));
    var spec = sharedObj.spec;
    Object.keys(sharedObj.byCode).forEach(function (key) {
      if (codes.indexOf(key) === -1) codes.push(key);
    });
    var missing = spec.mentioned.filter(function (c) {
      return !seenLower.has(c.toLowerCase());
    });
    var seenList = Array.from(sharedObj.seen).sort(function (a, b) {
      return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    var total = 0;
    for (var i = 0; i < codes.length; i++) total += sharedObj.byCode[codes[i]].length;

    var flat = [];
    var flatSeen = new Set();
    codes.forEach(function (key) {
      sharedObj.byCode[key].forEach(function (e) {
        if (flatSeen.has(e.link)) return;
        flatSeen.add(e.link);
        flat.push(e);
      });
    });
    total = flat.length;

    var out = [];
    out.push("<span style=\"color: #e03131\"><em><strong>Everything from here down to the line below Analytical Notes is regenerated every time you refresh this note.</strong> Do not type inside it. Write your own notes below that line, or a refresh will erase them.</em></span>");
    out.push("");
    out.push("## Scope");
    out.push("");
    out.push(
      "- **Built from " + codes.length + " code(s), " + total + " extract(s), " +
      sharedObj.matchedSources.size + " source(s), out of " +
      sharedObj.sources + " sources scanned.**"
    );
    out.push("- **Scanned:** " + sharedObj.sources + " selected item(s)");
    var shown = sharedObj.sourceList.slice(0, 50);
    for (var s = 0; s < shown.length; s++) {
      out.push("  - " + sharedObj.mdEscape(shown[s].cite));
    }
    if (sharedObj.sourceList.length > shown.length) {
      out.push("  - and " + (sharedObj.sourceList.length - shown.length) + " more");
    }
    out.push("- **Codes in this theme:** " + (spec.raw ? spec.raw : "*(none yet)*"));
    out.push("");
    out.push("*To reorder the evidence, change the order of the codes in the line above. To add a code to this theme, add it to that line. Then refresh this note (More Options, then Update content from templates).*");
    out.push("");
    out.push("*To combine codes, use AND, OR, and NOT in capital letters in that same line, with parentheses if needed, for example: fear appeal AND NOT humor. The expression is checked against the codes on each extract. Commas still mean \"or\". A plus sign between two codes also means AND, so a pair copied from a Code Matrix works as is.*");
    out.push("");
    if (spec.errors.length) {
      out.push("> **Part of the codes line was not understood and was ignored:** " + spec.errors.join("; ") + ". Write it like this: fear appeal AND NOT humor. Operators must be in capital letters.");
      out.push("");
    }

    if (sharedObj.skipped.length) {
      var skCodes = new Set();
      for (var q = 0; q < sharedObj.skipped.length; q++) {
        sharedObj.skipped[q].codes.forEach(function (c) {
          if (sharedObj.wanted.has(c.toLowerCase())) skCodes.add(c);
        });
      }
      out.push("> **" + sharedObj.skipped.length + " coded annotation(s) in this theme were skipped.** They have neither highlighted text nor a memo, so there is nothing to quote. These are usually image or area annotations. Add a memo to the annotation if you want it to appear here. Codes affected: " + Array.from(skCodes).sort().join(", "));
      out.push("");
    }

    if (missing.length) {
      out.push("> **Check these codes:** " + missing.join(", ") + ". They do not appear in what was scanned. Codes match on exact spelling, so look for a typo or different capitalization.");
      out.push(">");
      out.push("> Codes actually present in what was scanned: " + (seenList.length ? seenList.join(", ") : "none"));
      out.push("");
    }

    out.push("## Evidence");
    if (!flat.length) {
      out.push("");
      out.push("> Nothing to show. Check the codes line above. A Code Overview lists the exact spelling of the codes you have applied.");
    }
    for (var p2 = 0; p2 < flat.length; p2++) {
      out.push("");
      out.push(sharedObj.renderExtract(flat[p2]));
    }

    out.push("");
    out.push("## Analytical Notes");
    out.push("");
    out.push("*Write your thoughts about this theme after the line below. At minimum, you should include a \"Theme definition\" that explains, in two or three sentences, what this theme is about and what holds these codes together as a coherent theme. You can also add any other observations or insights that will be helpful when writing up your final report.*");

    return out.join("\n");
  }}$
  // @afterloop-end
