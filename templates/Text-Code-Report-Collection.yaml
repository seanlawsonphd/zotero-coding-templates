# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Text] Code Report (Collection)"
content: |-
  // @use-markdown
  ${{
    // Deliberately no @use-refresh here. This heading must stay outside the
    // refreshable block so it survives refreshes and gives the note its title.
    var title = "Code Report";
    if (!_env.dryRun) {
      try {
        var box = { value: "Code Report" };
        var ok = Services.prompt.prompt(
          null,
          "Code Report",
          "Title for this note. This becomes the note name in your Zotero list.",
          box,
          null,
          {}
        );
        if (ok && box.value.trim()) title = box.value.trim();
      } catch (e) {
        try {
          var typed = Zotero.getMainWindow().prompt(
            "Title for this note. This becomes the note name in your Zotero list.",
            "Code Report"
          );
          if (typed && typed.trim()) title = typed.trim();
        } catch (e2) {
          // keep the default
        }
      }
    }
    return "# " + title;
  }}$

  ${await Zotero.BetterNotes.api.template.runTextTemplate("[Text] Code Report BODY (do not use)", { targetNoteId: targetNoteItem ? targetNoteItem.id : undefined, dryRun: _env.dryRun })}

  <h3>Insights &amp; Observations</h3>
  <p></p>
  <p></p>
