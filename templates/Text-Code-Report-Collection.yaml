# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Text] Code Report (Collection)"
content: |-
  "// @use-markdown\n${{\n  // Deliberately no @use-refresh here. This heading must stay outside the\n  // refreshable block so it survives refreshes and gives the note its title.\n  var title = \"Code Report\";\n  if (!_env.dryRun) {\n    try {\n      var box = { value: \"Code Report\" };\n      var ok = Services.prompt.prompt(\n        null,\n        \"Code Report\",\n        \"Title for this note. This becomes the note name in your Zotero list.\",\n        box,\n        null,\n        {}\n      );\n      if (ok && box.value.trim()) title = box.value.trim();\n    } catch (e) {\n      try {\n        var typed = Zotero.getMainWindow().prompt(\n          \"Title for this note. This becomes the note name in your Zotero list.\",\n          \"Code Report\"\n        );\n        if (typed && typed.trim()) title = typed.trim();\n      } catch (e2) {\n        // keep the default\n      }\n    }\n  }\n  return \"# \" + title;\n}}$\n\n${await Zotero.BetterNotes.api.template.runTextTemplate(\"[Text] Code Report BODY (do not use)\", { targetNoteId: targetNoteItem ? targetNoteItem.id : undefined, dryRun: _env.dryRun })}"
