# Better Notes template share code. To install: copy this whole file's contents,
# then in Zotero choose Tools -> New Template from Clipboard, and click OK.
# Do not paste this into the Note Template Editor directly.
name: "[Item] Theme Document (Selected items)"
content: |-
  // @beforeloop-begin
  ${{
    // This outer template is not refreshable on purpose. It writes the title
    // line, which becomes the note name, and the writing headings at the end.
    // The refreshable part in between comes from the BODY template.
    var name = "Untitled theme";
    if (!_env.dryRun) {
      var question =
        "Name this theme. Use a short phrase that states its central organizing " +
        "concept, not a one-word topic label. This becomes the note name in your " +
        "Zotero list.";
      try {
        var box = { value: "" };
        var ok = Services.prompt.prompt(null, "Theme Document", question, box, null, {});
        if (ok && box.value.trim()) name = box.value.trim();
      } catch (e) {
        try {
          var typed = Zotero.getMainWindow().prompt(question, "");
          if (typed && typed.trim()) name = typed.trim();
        } catch (e2) {
          // keep the default
        }
      }
    }
    var esc = name.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    var body = await Zotero.BetterNotes.api.template.runItemTemplate(
      "[item] Helper for Theme Document (do not use)",
      {
        itemIds: items.map(function (item) { return item.id; }),
        targetNoteId: targetNoteItem ? targetNoteItem.id : undefined,
        dryRun: _env.dryRun
      }
    );
    return "<h1>Theme: " + esc + "</h1>\n" + body + "\n" + "<h3>Theme Definition</h3>\n<p></p>\n<p></p>\n<h3>Insights &amp; Observations</h3>\n<p></p>";
  }}$
  // @beforeloop-end
  // @default-begin
  // @default-end
